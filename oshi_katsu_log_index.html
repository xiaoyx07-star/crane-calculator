<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF5D8F">
<title>推し活ログ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#3A3042}
body{background:linear-gradient(180deg,#FFF9FC 0%,#F8F4FB 100%)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:0 16px 40px}
header{padding:28px 0 20px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title-row{display:flex;align-items:center;gap:8px}
h1{font-size:24px;margin:0;font-weight:800}
.sub{font-size:12px;color:#958B9E;margin:4px 0 0}
.primary{background:#FF5D8F;color:white;border-radius:16px;padding:11px 15px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 3px 8px #ff5d8f33}
.panel,.card,.empty,.profile-head{background:white;border:1px solid #F0E9F4;border-radius:24px;box-shadow:0 2px 10px rgba(58,48,66,.04)}
.panel{padding:16px;margin-bottom:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}
.chip{white-space:nowrap;border-radius:14px;padding:9px 12px;font-size:12px;font-weight:700;background:#F2ECF5;color:#9088A0}
.chip.active{background:#3A3042;color:white}
.chip.oshi.active{color:white}
.search-row{display:flex;gap:8px;margin-top:12px}
.searchbox{position:relative;flex:1}
.searchbox span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#A49AAE}
input,textarea,select{border:0;outline:0;background:#F7F3FB;color:#3A3042;border-radius:16px}
.searchbox input{width:100%;padding:11px 12px 11px 36px}
.small-btn{border-radius:16px;padding:9px 12px;background:#F2ECF5;color:#6F6478;font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px}
.day-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.day-nav{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:white;box-shadow:0 2px 8px rgba(58,48,66,.06)}
.day{text-align:center;min-width:132px}
.day strong{font-size:14px}
.day small{display:block;color:#A49AAE;font-size:11px;margin-top:2px}
.today{color:#FF5D8F;background:white;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:700}
.modes{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.pill{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:#F2ECF5;color:#9088A0;white-space:nowrap}
.pill.active{color:white}
.notice{background:#FFF0F5;border-radius:24px;padding:15px;margin-bottom:14px}
.notice strong{color:#D94D7B;font-size:14px}
.notice div{color:#8C6878;font-size:12px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:12px}
.card{padding:16px}
.video-top{display:flex;align-items:flex-start;gap:12px}
.video-icon{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.video-main{min-width:0;flex:1}
.meta{font-size:11px;color:#A49AAE;margin-bottom:4px}
.video-title{font-size:14px;font-weight:700;line-height:1.5}
.note-text{font-size:12px;color:#766B7F;line-height:1.6;margin-top:6px}
.note-input{width:100%;margin-top:11px;padding:9px 11px;font-size:12px}
.toggle-row{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;padding:42px 20px}
.empty-icon{width:56px;height:56px;margin:auto auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F7EAF1}
.empty strong{font-size:14px}
.empty p{font-size:12px;color:#A49AAE;margin:5px 0 0}
.profile-head{width:100%;padding:15px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;background:white}
.profile-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.profile{display:flex;align-items:center;gap:12px;padding:15px;background:white;border:1px solid #F0E9F4;border-radius:24px}
.avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0;flex:1}
.profile-name{font-weight:800;font-size:14px}
.profile-memo{font-size:12px;color:#8F8598;margin-top:4px;line-height:1.5}
footer{text-align:center;color:#B1A7B7;font-size:11px;margin-top:30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-box{background:white;border-radius:26px;padding:24px;width:100%;max-width:390px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h3{margin:0;font-size:18px}
.field-label{display:block;font-size:12px;color:#9088A0;font-weight:700;margin-bottom:5px}
.field{width:100%;padding:11px 14px;margin-bottom:15px;font-size:14px}
textarea.field{resize:none}
.photo-label{display:block;width:96px;height:96px;border-radius:50%;margin:0 auto 17px;position:relative;cursor:pointer}
.photo-preview{width:96px;height:96px;border-radius:50%;overflow:hidden;border:4px solid;display:flex;align-items:center;justify-content:center}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-edit{position:absolute;right:0;bottom:0;width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white}
.hidden{display:none}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin:7px 0 16px}
.color-dot{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.color-dot.selected{outline:3px solid;outline-offset:2px;border-color:white}
.color-custom{position:relative;width:32px;height:32px;border:2px dashed #D8CEE0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9088A0;overflow:hidden}
.color-custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.modal-actions{display:flex;gap:8px}
.save{flex:1;padding:12px;border-radius:16px;font-weight:800}
.delete{width:44px;border-radius:16px;background:#FFEAEA;color:#E56B6F}
.extra-actions{display:flex;gap:8px;margin-bottom:15px}
.extra-actions button{flex:1;padding:10px;border-radius:16px;font-size:12px;font-weight:700}
.select-oshi{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;margin-bottom:15px;font-size:14px;font-weight:800}
@media(max-width:520px){
  .header-row{align-items:flex-start}
  .primary{padding:10px 11px;font-size:12px}
  h1{font-size:22px}
  .day{min-width:116px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const COLOR_PRESETS=["#FF5D8F","#A78BFA","#4FD1C5","#FFC857","#FF8C42","#5FA8D3","#F76E9E","#8BD17C"];
const WEEKDAYS=["日","月","火","水","木","金","土"];
let idCounter=100;
const pad=n=>n<10?"0"+n:""+n;
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return fmtDate(d)};
const isLight=hex=>{const c=String(hex||"").replace("#","");if(c.length!==6)return false;const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return (r*299+g*587+b*114)/1000>165};
const rgba=(hex,a)=>{const c=String(hex||"").replace("#","");return "rgba("+parseInt(c.slice(0,2),16)+","+parseInt(c.slice(2,4),16)+","+parseInt(c.slice(4,6),16)+","+a+")"};
const nextId=p=>p+(++idCounter);
const SEED_OSHI=[
{id:"o1",name:"ひなた",color:"#FF5D8F",photo:null,memo:"いつも元気をくれる推し。ダンスと歌声が魅力！"},
{id:"o2",name:"つむぎ",color:"#4FD1C5",photo:null,memo:"まったり雑談配信が癒し。ゲーム実況も上手！"}];
const SEED_VIDEOS=[
{id:"v1",oshiId:"o1",date:fmtDate(new Date()),title:"【歌枠】水曜日の癒しタイム",watched:false,watchLater:true,note:""},
{id:"v2",oshiId:"o1",date:daysAgo(2),title:"新曲ダンス初披露！",watched:true,watchLater:false,note:"振り付け覚えたい、神回だった〜！"},
{id:"v3",oshiId:"o2",date:daysAgo(1),title:"まったり雑談＆質問コーナー",watched:true,watchLater:false,note:""},
{id:"v4",oshiId:"o2",date:fmtDate(new Date()),title:"新作ゲーム実況 #1",watched:false,watchLater:false,note:""}];

let oshiList=load("oshi_list_v1",SEED_OSHI);
let videos=load("oshi_videos_v1",SEED_VIDEOS);
let selectedOshi="all",selectedDate=fmtDate(new Date()),mode="all",search="",showProfile=false;
let modal=null;

function load(k,f){try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:f}catch(e){return f}}
function save(){try{localStorage.setItem("oshi_list_v1",JSON.stringify(oshiList));localStorage.setItem("oshi_videos_v1",JSON.stringify(videos))}catch(e){alert("保存容量を超えた可能性があります。写真を小さくして再登録してください。")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function icon(name,size=18,fill="none"){
 const paths={
  plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',
  check:'<path d="M5 12l4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bookmark:'<path d="M6 4h12v16l-6-3-6 3z"/>',heart:'<path d="M20.8 8.9c0 5.2-8.8 10.1-8.8 10.1S3.2 14.1 3.2 8.9A5 5 0 0 1 12 6.1a5 5 0 0 1 8.8 2.8z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  camera:'<path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 6l4 4"/>',star:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',spark:'<path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/>',
  youtube:'<rect x="3" y="6" width="18" height="12" rx="3"/><path d="m10 9 5 3-5 3z"/>'
 };
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+fill+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||"")+'</svg>'
}
function filtered(){
 return videos.filter(v=>{
  const o=oshiList.find(x=>x.id===v.oshiId);if(!o)return false;
  if(selectedOshi!=="all"&&v.oshiId!==selectedOshi)return false;
  if(mode==="unwatched"&&v.watched)return false;
  if(mode==="later"&&!v.watchLater)return false;
  if(search&&!((v.title+" "+(v.note||"")+" "+o.name).toLowerCase().includes(search.toLowerCase())))return false;
  return true
 }).sort((a,b)=>b.date.localeCompare(a.date))
}
function render(){
 const today=fmtDate(new Date()), list=filtered(), dateVideos=list.filter(v=>v.date===selectedDate);
 document.getElementById("app").innerHTML=`
 <div class="app"><div class="wrap">
 <header><div class="header-row"><div><div class="title-row">${icon("spark",18)}<h1>推し活ログ</h1></div><p class="sub">好きな配信を、好きなだけ記録しよう。</p></div>
 <button class="primary" onclick="openOshi()">${icon("plus",16)}推しを登録</button></div></header>
 <section class="panel"><div class="chips">
 <button class="chip ${selectedOshi==="all"?"active":""}" onclick="selectOshi('all')">すべて</button>
 ${oshiList.map(o=>`<button class="chip oshi ${selectedOshi===o.id?"active":""}" style="${selectedOshi===o.id?`background:${o.color};color:${isLight(o.color)?"#3A3042":"#fff"}`:""}" onclick="selectOshi('${o.id}')"><span style="display:inline-flex;width:20px;height:20px;border-radius:50%;background:${rgba(o.color,.25)};align-items:center;justify-content:center;vertical-align:middle;overflow:hidden">${o.photo?`<img src="${o.photo}" style="width:100%;height:100%;object-fit:cover">`:icon("star",11)}</span> ${esc(o.name)}</button>`).join("")}
 </div><div class="search-row"><div class="searchbox">${icon("search",15)}<input value="${esc(search)}" placeholder="配信を検索" oninput="setSearch(this.value)"></div>
 <button class="small-btn" onclick="openVideo('${selectedOshi==="all"?"":selectedOshi}')">${icon("plus",15)}配信</button></div></section>
 <section class="day-row"><div class="day-nav"><button class="icon-btn" onclick="changeDay(-1)">${icon("left",18)}</button><div class="day"><strong>${selectedDate}</strong><small>${selectedDate===today?"今日":WEEKDAYS[new Date(selectedDate+"T12:00:00").getDay()]+"曜日"}</small></div><button class="icon-btn" onclick="changeDay(1)">${icon("right",18)}</button></div><button class="today" onclick="selectedDate=fmtDate(new Date());render()">今日</button></section>
 <div class="modes">
 ${pill("all","heart","#3A3042","すべて")}${pill("unwatched","clock","#FF5D8F","未視聴")}${pill("later","bookmark","#A78BFA","あとで見る")}
 </div>
 ${selectedDate===today&&dateVideos.length?`<div class="notice"><strong>${icon("spark",16)} 今日の推し活</strong><div>${dateVideos.length}件の配信があります</div></div>`:""}
 <div class="list">${list.map(card).join("")}</div>
 ${!list.length?`<div class="empty"><div class="empty-icon">${icon("heart",24)}</div><strong>まだ配信がありません</strong><p>「配信」を押して記録してみよう。</p></div>`:""}
 <section style="margin-top:24px"><button class="profile-head" onclick="showProfile=!showProfile;render()"><span>${icon("star",16,"#FFC857")} 推し一覧</span>${icon(showProfile?"left":"right",17)}</button>
 ${showProfile?`<div class="profile-list">${oshiList.map(profile).join("")}</div>`:""}</section>
 <footer>データはこの端末のブラウザに保存されます</footer>
 </div></div>${modal?renderModal():""}`;
}
function pill(key,ico,color,label){return `<button class="pill ${mode===key?"active":""}" style="${mode===key?`background:${color};color:${isLight(color)?"#3A3042":"#fff"}`:""}" onclick="mode='${key}';render()">${icon(ico,14)}${label}</button>`}
function card(v){
 const o=oshiList.find(x=>x.id===v.oshiId);
 return `<div class="card"><div class="video-top"><div class="video-icon" style="background:${rgba(o.color,.15)};color:${o.color}">${icon("youtube",21)}</div><div class="video-main"><div class="meta">${v.date} ・ ${esc(o.name)}</div><div class="video-title">${esc(v.title)}</div>${v.note?`<div class="note-text">${esc(v.note)}</div>`:""}</div><button class="icon-btn" style="background:#FFF1F2;box-shadow:none" onclick="deleteVideo('${v.id}')">${icon("trash",15)}</button></div>
 <div class="toggle-row"><button class="pill ${v.watched?"active":""}" style="${v.watched?`background:${o.color};color:${isLight(o.color)?"#3A3042":"#fff"}`:""}" onclick="toggleVideo('${v.id}','watched')">${icon("check",14)}${v.watched?"視聴済み":"未視聴"}</button>
 <button class="pill ${v.watchLater?"active":""}" style="${v.watchLater?`background:${o.color};color:${isLight(o.color)?"#3A3042":"#fff"}`:""}" onclick="toggleVideo('${v.id}','watchLater')">${icon("bookmark",14)}あとで見る</button></div>
 <input class="note-input" value="${esc(v.note||"")}" placeholder="感想メモを入力…" oninput="updateNote('${v.id}',this.value)"></div>`
}
function profile(o){return `<div class="profile"><div class="avatar" style="background:${rgba(o.color,.15)};border:3px solid ${o.color}">${o.photo?`<img src="${o.photo}">`:icon("star",23)}</div><div class="profile-info"><div class="profile-name">${esc(o.name)}</div><div class="profile-memo">${esc(o.memo||"紹介メモはまだありません。")}</div></div><button class="small-btn" onclick="openOshi('${o.id}')">編集</button></div>`}
function renderModal(){
 if(modal.type==="oshi")return oshiModal(modal.id?oshiList.find(o=>o.id===modal.id):null);
 return videoModal(modal.oshiId||"");
}
function oshiModal(initial){
 const color=initial?.color||COLOR_PRESETS[0],photo=initial?.photo||null;
 return `<div class="modal" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()"><div class="modal-head"><h3>${initial?"推しを編集":"推しを登録"}</h3><button class="icon-btn" onclick="closeModal()">${icon("x",18)}</button></div>
 <label class="photo-label"><div id="photoPreview" class="photo-preview" style="border-color:${color};background:${rgba(color,.15)}">${photo?`<img src="${photo}">`:icon("camera",28)}</div><div class="photo-edit" style="background:${color}">${icon("edit",14)}</div><input id="photoInput" class="hidden" type="file" accept="image/*" onchange="previewPhoto(this,'${color}')"></label>
 <label class="field-label">お名前</label><input id="oshiName" class="field" value="${esc(initial?.name||"")}" placeholder="例：ひなた">
 <label class="field-label">テーマカラー</label><div class="colors">${COLOR_PRESETS.map(c=>`<button class="color-dot ${color===c?"selected":""}" style="background:${c};${color===c?`outline-color:${c}`:""}" onclick="setModalColor('${c}')"></button>`).join("")}<label class="color-custom">+<input id="customColor" type="color" value="${color}" onchange="setModalColor(this.value)"></label></div>
 <label class="field-label">紹介メモ</label><textarea id="oshiMemo" class="field" rows="3" placeholder="推しの魅力を書こう！">${esc(initial?.memo||"")}</textarea>
 ${initial?`<div class="extra-actions"><button style="background:${rgba(color,.18)};color:${color}" onclick="openVideo('${initial.id}')">${icon("plus",13)}配信を追加</button><button style="background:#F2ECF5;color:#9088A0" onclick="importDemo('${initial.id}')">${icon("youtube",13)}取り込む(デモ)</button></div>`:""}
 <div class="modal-actions">${initial?`<button class="delete" onclick="deleteOshi('${initial.id}')">${icon("trash",18)}</button>`:""}<button class="save" style="background:${color};color:${isLight(color)?"#3A3042":"#fff"}" onclick="saveOshi('${initial?.id||""}')">保存する</button></div>
 </div></div>`
}
function videoModal(defaultOshi){
 const o=oshiList.find(x=>x.id===(defaultOshi||oshiList[0]?.id));
 return `<div class="modal" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()"><div class="modal-head"><h3>配信を追加</h3><button class="icon-btn" onclick="closeModal()">${icon("x",18)}</button></div>
 <label class="field-label">推し</label>${defaultOshi&&o?`<div class="select-oshi" style="background:${o.color};color:${isLight(o.color)?"#3A3042":"#fff"}">${icon("star",12,"currentColor")}${esc(o.name)}</div>`:`<select id="videoOshi" class="field">${oshiList.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`}
 <label class="field-label">配信日</label><input id="videoDate" type="date" class="field" value="${selectedDate}">
 <label class="field-label">タイトル</label><input id="videoTitle" class="field" placeholder="配信タイトル">
 <label class="field-label">メモ（任意）</label><textarea id="videoNote" class="field" rows="3" placeholder="感想など"></textarea>
 <button class="save" style="width:100%;background:${o?.color||"#FF5D8F"};color:${isLight(o?.color)?"#3A3042":"#fff"}" onclick="saveVideo('${defaultOshi}')">保存する</button>
 </div></div>`
}
let modalColor=null,modalPhoto=null;
function openOshi(id=""){modal={type:"oshi",id};modalColor=null;modalPhoto=null;render()}
function openVideo(oshiId=""){modal={type:"video",oshiId};render()}
function closeModal(){modal=null;render()}
function setModalColor(c){modalColor=c;const p=document.getElementById("photoPreview");if(p){p.style.borderColor=c;p.style.background=rgba(c,.15)}document.querySelectorAll(".color-dot").forEach(b=>b.classList.remove("selected"));render()}
function previewPhoto(input,color){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{modalPhoto=r.result;const p=document.getElementById("photoPreview");p.innerHTML='<img src="'+r.result+'">';};r.readAsDataURL(f)}
function saveOshi(id){
 const old=id?oshiList.find(o=>o.id===id):null;
 const name=document.getElementById("oshiName").value.trim();if(!name)return;
 const color=modalColor||old?.color||COLOR_PRESETS[0],memo=document.getElementById("oshiMemo").value,photo=modalPhoto!==null?modalPhoto:(old?.photo||null);
 const data={id:id||nextId("o"),name,color,memo,photo};
 oshiList=id?oshiList.map(o=>o.id===id?data:o):[...oshiList,data];save();modal=null;render()
}
function deleteOshi(id){const o=oshiList.find(x=>x.id===id);if(!confirm((o?.name||"この推し")+"を削除しますか？\\n関連する配信も削除されます。"))return;oshiList=oshiList.filter(x=>x.id!==id);videos=videos.filter(v=>v.oshiId!==id);if(selectedOshi===id)selectedOshi="all";save();modal=null;render()}
function saveVideo(defaultOshi){
 const oshiId=defaultOshi||document.getElementById("videoOshi").value,date=document.getElementById("videoDate").value,title=document.getElementById("videoTitle").value.trim(),note=document.getElementById("videoNote").value;
 if(!oshiId||!title)return;
 videos=[{id:nextId("v"),oshiId,date,title,watched:false,watchLater:false,note},...videos];save();modal=null;render()
}
function importDemo(id){videos=[{id:nextId("v"),oshiId:id,date:fmtDate(new Date()),title:"【デモ】取り込んだ配信サンプル",watched:false,watchLater:true,note:"YouTube取り込みのデモです。"},...videos];save();modal=null;render()}
function selectOshi(id){selectedOshi=id;render()}
function setSearch(v){search=v;render()}
function changeDay(n){const d=new Date(selectedDate+"T12:00:00");d.setDate(d.getDate()+n);selectedDate=fmtDate(d);render()}
function toggleVideo(id,key){videos=videos.map(v=>v.id===id?{...v,[key]:!v[key]}:v);save();render()}
function updateNote(id,note){videos=videos.map(v=>v.id===id?{...v,note}:v);save()}
function deleteVideo(id){videos=videos.filter(v=>v.id!==id);save();render()}
render();
</script>
